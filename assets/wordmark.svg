<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 42" width="250" height="42" role="img"
     aria-label="GTM Intelligence Platform">
  <!-- Proportions, not uniform scaling: st.logo fits to a fixed height, so legibility is the glyph
       height as a fraction of viewBox height. The lockup went 300x48 -> 250x42 while the name went
       22 -> 23px, lifting it from 46% to 55% of the height. The mark's share was deliberately REDUCED
       (32 -> 26 units wide) so the wordmark leads and the symbol supports it, and internal padding was
       tightened so the lockup reads as one object rather than two. -->
  <g stroke="#8B93A1" fill="#8B93A1">
    <path d="M14.5 13 L20 26 L9 26 Z" stroke-width="0" opacity="0.55"/>
    <line x1="3" y1="10" x2="26" y2="16.5" stroke-width="2.9" stroke-linecap="round"/>
    <circle cx="3" cy="10" r="2.9" stroke-width="0"/>
    <circle cx="26" cy="16.5" r="4.7" stroke-width="0"/>
  </g>
  <text x="36" y="23" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23"
        font-weight="700" fill="#B6BECC" letter-spacing="-0.5">GTM Intelligence</text>
  <text x="37" y="36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8.5"
        font-weight="600" fill="#79818F" letter-spacing="3.1">PLATFORM</text>
</svg>
