<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img"
     aria-label="GTM Intelligence Platform mark">
  <!-- Balance mark: beam on a fulcrum carrying two weights, tilted because a decision was reached.
       Stroke weights are deliberately heavy so the silhouette survives at favicon scale. -->
  <g stroke="currentColor" fill="currentColor">
    <path d="M20 15.5 L28 33 L12 33 Z" stroke-width="0" opacity="0.55"/>
    <line x1="5" y1="11" x2="35" y2="19.5" stroke-width="3.6" stroke-linecap="round"/>
    <circle cx="5" cy="11" r="3.6" stroke-width="0"/>
    <circle cx="35" cy="19.5" r="6" stroke-width="0"/>
  </g>
</svg>
